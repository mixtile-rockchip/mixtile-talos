name: Build Talos for Mixtile Blade 3

on:
  # workflow_dispatch only works once this file is on the default branch;
  # development branches build on push.
  push:
    branches:
      - "claude/**"
      - "feat/**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: OCI tag for the Blade 3 overlay
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: blade3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Native arm64: the openmiop extension builds the Talos kernel tree
    # (vmlinux + modules_prepare), which is too slow under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image coordinates
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          tag=${REQUESTED_TAG:-ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}}
          # A release tag names the images after the tag.
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && tag=${GITHUB_REF_NAME}
          echo "USERNAME=${owner}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"
          # Packages this workflow creates (and may therefore write).
          echo "OVERLAY_NAME=sbc-mixtile-blade3-ci" >> "${GITHUB_ENV}"
          echo "OPENMIOP_NAME=openmiop" >> "${GITHUB_ENV}"
          echo "INSTALLER_IMAGE=ghcr.io/${owner}/mixtile-talos-installer:${tag}" >> "${GITHUB_ENV}"
          # Layer cache: the kernel tree stage takes most of a cold build.
          echo "BUILD_CACHE=ghcr.io/${owner}/mixtile-talos-buildcache" >> "${GITHUB_ENV}"
          # The kernel tree as a prebuilt image, rebuilt only when its inputs change.
          echo "KERNEL_IMAGE=1" >> "${GITHUB_ENV}"

      - name: Build overlay and Talos images
        run: ./build.sh all

      - name: Inspect the installer image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools zstd device-tree-compiler
          ./scripts/verify-installer.sh _out
          grep -qx "commit: ${GITHUB_SHA}" _out/BUILD-INFO.txt
          grep -qx "commit-dirty: no" _out/BUILD-INFO.txt
          (cd _out && sha256sum -c SHA256SUMS)

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${GITHUB_REF_NAME}" _out

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mixtile-blade3-talos-${{ env.IMAGE_TAG }}
          path: _out/
          if-no-files-found: error
          retention-days: 14
